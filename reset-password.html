
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b35">
<title>PrintoraKM | استرجاع كلمة المرور</title>
<style>
:root{--navy:#101b35;--blue:#2868f5;--cyan:#20c8e8;--bg:#f1f5fc;--text:#1a2942;--muted:#7a879c;--border:#e3e9f4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#d7e7ff 0,transparent 30%),radial-gradient(circle at 90% 90%,#c9f5ff 0,transparent 28%),var(--bg);color:var(--text)}
.card{width:min(440px,100%);background:white;border:1px solid #e8edf6;border-radius:25px;padding:32px;box-shadow:0 25px 70px #1b376b12;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;right:0;left:0;height:5px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.logo{width:58px;height:58px;margin:4px auto 18px;border-radius:17px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:white;font-weight:900;font-size:30px;box-shadow:0 7px 18px #2868f533}
h1{text-align:center;color:var(--navy);font-size:24px;margin:0 0 10px}
.description{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;margin:0 0 24px}
label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}
input{width:100%;height:48px;padding:0 13px;border:1px solid var(--border);border-radius:11px;background:#fbfcff;color:var(--text);font:inherit;outline:none;margin-bottom:16px}
input:focus{border-color:#82a8ff;box-shadow:0 0 0 3px #2868f511}
button{width:100%;height:49px;border:0;border-radius:12px;background:linear-gradient(110deg,var(--blue),#348bff 65%,var(--cyan));color:white;font-weight:900;font-size:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.message{display:none;padding:12px;border-radius:10px;font-size:12px;line-height:1.8;margin-bottom:16px;overflow-wrap:anywhere}
.message.show{display:block}
.message.error{background:#fff0f0;color:#b52b3c;border:1px solid #ffd9de}
.message.success{background:#eafaf2;color:#13764a;border:1px solid #c8f0dc}
a{display:block;text-align:center;margin-top:20px;color:var(--blue);text-decoration:none;font-size:12px;font-weight:800}
</style>
</head>
<body>
<section class="card">
  <div class="logo">P</div>
  <h1>تغيير كلمة المرور</h1>
  <p class="description">أدخل كلمة المرور الجديدة لحسابك في PrintoraKM.</p>

  <div id="message" class="message" role="status" aria-live="polite"></div>

  <form id="resetForm">
    <label for="password">كلمة المرور الجديدة</label>
    <input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="6 أحرف على الأقل" required>

    <label for="confirmPassword">تأكيد كلمة المرور</label>
    <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور" required>

    <button id="saveButton" type="submit">حفظ كلمة المرور الجديدة</button>
  </form>

  <a href="index.html">العودة إلى تسجيل الدخول</a>
</section>

<script type="module">
import { supabase } from "./supabase.js";

const $ = id => document.getElementById(id);
let ready = false;
let busy = false;

function showMessage(text, type = "error") {
  $("message").textContent = text;
  $("message").className = "message show " + type;
}

function setReady(value) {
  ready = value;
  $("saveButton").disabled = !value || busy;
}

setReady(false);

async function initializeRecovery() {
  try {
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    const hash = new URLSearchParams(url.hash.slice(1));
    const hashError = hash.get("error_description") || url.searchParams.get("error_description");

    if (hashError) {
      showMessage("رابط الاسترجاع غير صالح أو انتهت صلاحيته. اطلب رابطًا جديدًا من صفحة الدخول.");
      return;
    }

    if (code) {
      const { error } = await supabase.auth.exchangeCodeForSession(code);
      if (error) throw error;

      window.history.replaceState({}, document.title, url.pathname);
    }

    const { data, error } = await supabase.auth.getSession();
    if (error) throw error;

    if (!data.session) {
      showMessage("افتح رابط استرجاع كلمة المرور الذي وصلك في البريد الإلكتروني. إذا انتهت صلاحيته، اطلب رابطًا جديدًا.");
      return;
    }

    setReady(true);
  } catch (error) {
    console.error(error);
    showMessage("تعذر التحقق من الرابط. ارجع إلى صفحة الدخول واطلب رابط استرجاع جديد.");
  }
}

$("resetForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!ready || busy) return;

  const password = $("password").value;
  const confirmPassword = $("confirmPassword").value;

  if (password.length < 6) {
    showMessage("كلمة المرور لازم تكون 6 أحرف على الأقل.");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("كلمتا المرور غير متطابقتين.");
    return;
  }

  busy = true;
  $("saveButton").disabled = true;
  $("saveButton").textContent = "جارٍ حفظ كلمة المرور...";

  try {
    const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
    if (sessionError) throw sessionError;

    if (!sessionData.session) {
      throw new Error("انتهت صلاحية رابط الاسترجاع. اطلب رابطًا جديدًا.");
    }

    const { error } = await supabase.auth.updateUser({ password });
    if (error) throw error;

    showMessage("تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.", "success");
    $("resetForm").style.display = "none";

    await supabase.auth.signOut({ scope: "local" });

    setTimeout(() => {
      window.location.replace("index.html");
    }, 2500);
  } catch (error) {
    console.error(error);
    showMessage(error.message || "تعذر تغيير كلمة المرور. اطلب رابطًا جديدًا وحاول مجددًا.");
  } finally {
    busy = false;
    $("saveButton").textContent = "حفظ كلمة المرور الجديدة";
    $("saveButton").disabled = !ready;
  }
});

initializeRecovery();
</script>
</body>
</html>
